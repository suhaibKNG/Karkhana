<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    
    <!-- YouTube iFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }

        .track-info {
            text-align: center;
            margin-bottom: 15px;
        }

        .track-name {
            font-weight: bold;
            font-size: 18px;
        }

        .artist-name {
            color: #666;
            font-size: 14px;
        }

        #player {
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .playlist {
            margin-top: 20px;
            list-style: none;
            padding: 0;
        }

        .playlist li {
            padding: 8px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .playlist li:hover {
            background-color: #f7f7f7;
        }

        .playlist li.active {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="track-info">
            <div class="track-name" id="track-name">YouTube Playlist</div>
            <div class="artist-name" id="artist-name">Suhaib Music Player</div>
        </div>

        <!-- YouTube Player Container -->
        <div id="player"></div>

        <div class="controls">
            <button id="prev-btn">Prev</button>
            <button id="play-btn">Play</button>
            <button id="next-btn">Next</button>
        </div>

        <ul class="playlist" id="playlist">
            <!-- Playlist items -->
        </ul>
    </div>

    <!-- YouTube Player Logic Script -->
    <script>
        var player;

        // YouTube API ready function
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '200',
                width: '100%',
                playerVars: {
                    'listType': 'playlist',
                    'list': 'PLYIexFLR0TOmkUsnZ1Jk08Lt8--owBp6g',
                    'autoplay': 0,
                    'controls': 1
                }
            });
        }

        // Custom Buttons Control
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        playBtn.addEventListener('click', () => {
            if (player && player.getPlayerState) {
                const state = player.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                    playBtn.textContent = 'Play';
                } else {
                    player.playVideo();
                    playBtn.textContent = 'Pause';
                }
            }
        });

        prevBtn.addEventListener('click', () => {
            if (player && player.previousVideo) {
                player.previousVideo();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (player && player.nextVideo) {
                player.nextVideo();
            }
        });
    </script>
</body>
</html>
