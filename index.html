
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .player-container {
    background-color: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    width: 300px;
  }
  .track-info {
    text-align: center;
    margin-bottom: 15px;
  }
  .track-name {
    font-weight: bold;
    font-size: 18px;
  }
  .artist-name {
    color: #666;
    font-size: 14px;
  }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  button {
    background-color: #007bff;
    color: #fff;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
  }
  button:hover {
    background-color: #0056b3;
  }
  .playlist {
    margin-top: 20px;
    list-style: none;
    padding: 0;
  }
  .playlist li {
    padding: 8px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
  }
  .playlist li:hover {
    background-color: #f7f7f7;
  }
  .playlist li.active {
    font-weight: bold;
    color: #007bff;
  }
</style>
</head>
<body>

<div class="player-container">
  <div class="track-info">
    <div class="track-name" id="track-name">Select a track</div>
    <div class="artist-name" id="artist-name"></div>
  </div>
  <div class="controls">
    <button id="prev-btn">Prev</button>
    <button id="play-btn">Play</button>
    <button id="next-btn">Next</button>
  </div>
  <ul class="playlist" id="playlist">
    <!-- Playlist items will be injected here by JS -->
  </ul>
</div>

<audio id="audio-player"></audio>

<script>
  const tracks = [
    { name: "Song 1", artist: "Artist 1", src: "path/to/song1.mp3" },
    { name: "Song 2", artist: "Artist 2", src: "path/to/song2.mp3" },
    { name: "Song 3", artist: "Artist 3", src: "path/to/song3.mp3" }
  ];

  let currentTrackIndex = 0;
  const audioPlayer = document.getElementById('audio-player');
  const trackName = document.getElementById('track-name');
  const artistName = document.getElementById('artist-name');
  const playBtn = document.getElementById('play-btn');
  const playlist = document.getElementById('playlist');

  function loadTrack(index) {
    const track = tracks[index];
    trackName.textContent = track.name;
    artistName.textContent = track.artist;
    audioPlayer.src = track.src;
    highlightActiveTrack(index);
  }

  function highlightActiveTrack(index) {
    const items = playlist.getElementsByTagName('li');
    for (let i = 0; i < items.length; i++) {
      if (i === index) {
        items[i].classList.add('active');
      } else {
        items[i].classList.remove('active');
      }
    }
  }

  function playTrack() {
    audioPlayer.play();
    playBtn.textContent = "Pause";
  }

  function pauseTrack() {
    audioPlayer.pause();
    playBtn.textContent = "Play";
  }

  playBtn.addEventListener('click', () => {
    if (audioPlayer.paused) {
      playTrack();
    } else {
      pauseTrack();
    }
  });

  document.getElementById('prev-btn').addEventListener('click', () => {
    currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
    loadTrack(currentTrackIndex);
    playTrack();
  });

  document.getElementById('next-btn').addEventListener('click', () => {
    currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
    loadTrack(currentTrackIndex);
    playTrack();
  });

  function initPlaylist() {
    tracks.forEach((track, index) => {
      const li = document.createElement('li');
      li.textContent = `${track.name} - ${track.artist}`;
      li.addEventListener('click', () => {
        currentTrackIndex = index;
        loadTrack(currentTrackIndex);
        playTrack();
      });
      playlist.appendChild(li);
    });
  }

  initPlaylist();
  loadTrack(currentTrackIndex);
</script>

</body>
</html>
